<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar Proveedor</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="clientes-container">
    <header class="clientes-header">
      <button id="home" class="btn-volver">←</button>
    </header>

    <main>
       <form id="form-agregar-proveedor" class="form-cliente" novalidate>

      <h2>Proveedor &gt; Añadir</h2>

      <!-- Banner error duplicado -->
      <div id="mensaje-error-duplicado"></div>

      <div class="campo">
        <input type="text" id="nombre" placeholder="Nombre">
        <span class="error-msg" id="err-nombre">El nombre no puede estar vacío.</span>
      </div>

      <div class="campo">
        <input type="text" id="direccion" placeholder="Dirección">
        <span class="error-msg" id="err-direccion">Ingresá una dirección válida (Ej: Calle Falsa 123).</span>
      </div>

      <div class="campo">
        <input type="text" id="telefono" placeholder="Teléfono">
        <span class="error-msg" id="err-telefono">Ingresá un número de teléfono válido.</span>
      </div>

      <div class="campo">
        <input type="text" id="email" placeholder="Correo electrónico">
        <span class="error-msg" id="err-email">Ingresá un correo electrónico válido.</span>
      </div>

      <div class="campo">
        <input type="text" id="codigo_postal" placeholder="Código Postal">
        <span class="error-msg" id="err-codigo_postal">Ingresá un código postal válido (4 a 10 dígitos).</span>
      </div>

      <div class="form-botones">
        <button type="button" class="btn-cancelar" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn-guardar">Guardar</button>
      </div>

      <div class="toast" id="toast">✅ Proveedor guardado correctamente.</div>
    </form>
    </main>
  </div>

  <script type="module" src="./script.js"></script>
</body>
</html>
